<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聖經研讀室｜私人音訊連線測試</title><style>body{font:18px/1.6 system-ui;max-width:850px;margin:auto;padding:24px;background:#f6f5f0;color:#173337}section{background:white;padding:22px;margin:16px 0;border-radius:16px}button,a{font:inherit}button{padding:10px;margin:5px;cursor:pointer}audio{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{display:block}</style><h1>聖經研讀室</h1><p>私人音訊連線測試版</p><p>此頁不含經文資料庫或音檔。音訊仍由私人 Cloudflare 服務保護，只有原本有權限的使用者能登入讀取。</p><p><a id="login" target="_blank" rel="noopener">先開啟私人音訊頁並登入</a></p><p>登入後回到此頁，逐一測試。若跨站連線失敗，可到私人頁測試；不代表 GitHub 內播放已接通。</p><main></main><script type="module">

for(const [lang,key,size] of clips){const section=document.createElement('section');const h=document.createElement('h2');h.textContent=lang+' · 馬太福音 7:1';const button=document.createElement('button');button.textContent='讀取並準備播放';const audio=document.createElement('audio');audio.controls=true;audio.preload='none';const out=document.createElement('pre');out.setAttribute('aria-live','polite');out.textContent='尚未測試';let objectURL;button.onclick=async()=>{audio.pause();audio.removeAttribute('src');audio.load();if(objectURL){URL.revokeObjectURL(objectURL);objectURL=null;}button.disabled=true;const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);out.textContent='讀取中…';try{const r=await fetch(gateway+'/audio/'+key+'.mp3',{credentials:'include',mode:'cors',cache:'no-store',redirect:'error',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);const bytes=await r.arrayBuffer();if(bytes.byteLength!==size)throw Error('音檔長度不符');const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(x=>x.toString(16).padStart(2,'0')).join('');if(hash!==key)throw Error('音檔校驗不符');if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(new Blob([bytes],{type:'audio/mpeg'}));audio.src=objectURL;out.textContent='讀取與校驗通過，請按播放。尚未確認實際聽到聲音。';}catch(e){out.textContent='未接通：'+e.message+'。可能是登入或跨站存取限制；請先開啟私人頁。按下方按鈕可手動重試。';}finally{clearTimeout(timer);button.disabled=false;button.textContent='重新讀取';}};audio.onplaying=()=>{out.textContent='瀏覽器已進入播放狀態；請確認是否聽到正確音訊。'};section.append(h,button,audio,out);document.querySelector('main').append(section)}
</script></html>
